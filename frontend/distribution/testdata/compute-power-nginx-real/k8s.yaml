apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-power-nginx-real
  namespace: default
  labels:
    app: compute-power-nginx-real
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compute-power-nginx-real
  template:
    metadata:
      labels:
        app: compute-power-nginx-real
    spec:
      containers:
        - name: nginx
          image: sealos.hub:5000/default/compute-power-nginx-real:api-test
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: compute-power-nginx-real
  namespace: default
  labels:
    app: compute-power-nginx-real
spec:
  type: NodePort
  selector:
    app: compute-power-nginx-real
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31280
