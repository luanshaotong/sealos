server {
    listen 8080;
    server_name _;

    location = /api {
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","service":"compute-power-nginx-real"}';
    }

    location / {
        add_header Content-Type text/plain always;
        return 200 'compute-power-nginx-real';
    }
}
