syntax = "proto3";

package dns_service;

// CoreDNS 自定义域名解析 gRPC 服务
service DnsService {
  // 查询指定域名的 DNS 记录
  rpc Lookup (DnsLookupRequest) returns (DnsLookupResponse);
  // 获取所有自定义 DNS 记录（用于批量同步）
  rpc GetAllRecords (Empty) returns (DnsRecordsResponse);
}

message Empty {}

message DnsLookupRequest {
  string domain = 1;
  string record_type = 2; // A, AAAA, CNAME, TXT, MX, SRV
}

message DnsRecord {
  string domain = 1;
  string record_type = 2;
  string value = 3;
  uint32 ttl = 4;
}

message DnsLookupResponse {
  bool found = 1;
  repeated DnsRecord records = 2;
}

message DnsRecordsResponse {
  repeated DnsRecord records = 1;
}
